# Orbyto — exemplo para /etc/nginx/sites-available/orbyto
# O Certbot adicionará as diretivas SSL após a emissão do certificado.

server {
    listen 80;
    listen [::]:80;
    server_name www.orbyto.com.br orbyto.com.br;
    client_max_body_size 10m;

    # Canonicaliza o domínio raiz sem afetar os fallbacks locais da aplicação.
    if ($host = orbyto.com.br) {
        return 301 https://www.orbyto.com.br$request_uri;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
